server:
  port: ${PORT:5000}
  servlet:
    context-path: /api

spring:
  application:
    name: laptop-buyback-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/laptop_buyback}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1007}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CashXPostgresPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# Security & JWT Configuration
jwt:
  secret: ${JWT_SECRET:TheCashXLaptopBuybackSuperSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

# SMS Provider Configuration
sms:
  provider: ${SMS_PROVIDER:dev} # 'dev' or 'production'
  api-key: ${SMS_API_KEY:}
  sender-id: ${SMS_SENDER_ID:CASHX}

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Logging Configuration
logging:
  level:
    root: INFO
    com.thecashx.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
